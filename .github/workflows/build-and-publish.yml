name: Build and SonarQube

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release_version:
        description: Optional release version used for the packaged plugin
        required: false
        type: string
        default: ''
      release_build:
        description: Build a release plugin instead of a development snapshot
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: true
    outputs:
      version:
        description: Version of the verified plugin artifact
        value: ${{ jobs.build.outputs.version }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: |
          intellij-plugin/*.gradle.kts
          intellij-plugin/gradle.properties
          intellij-plugin/gradle/wrapper/gradle-wrapper.properties

    - name: Resolve plugin version
      id: version
      env:
        REQUESTED_RELEASE_VERSION: ${{ inputs.release_version || '' }}
        RELEASE_BUILD: ${{ inputs.release_build || false }}
      run: |
        set -euo pipefail
        VERSION=$(sed -n 's/^pluginVersion=//p' intellij-plugin/gradle.properties | tr -d '\r')
        [[ -n "$VERSION" ]] || { echo "::error::pluginVersion is missing."; exit 1; }
        if [[ -n "$REQUESTED_RELEASE_VERSION" ]]; then
          VERSION=$REQUESTED_RELEASE_VERSION
        elif [[ "$RELEASE_BUILD" == "true" && "$VERSION" == *-SNAPSHOT ]]; then
          VERSION=${VERSION%-SNAPSHOT}
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Verify SonarQube Cloud configuration
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      run: |
        [[ -n "$SONAR_TOKEN" ]] || { echo "::error::SONAR_TOKEN is not configured"; exit 1; }
        [[ -n "$SONAR_ORGANIZATION" ]] || { echo "::error::SONAR_ORGANIZATION is not configured"; exit 1; }
        [[ -n "$SONAR_PROJECT_KEY" ]] || { echo "::error::SONAR_PROJECT_KEY is not configured"; exit 1; }

    - name: Test, package, verify, and analyze plugin
      working-directory: intellij-plugin
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        REQUESTED_RELEASE_VERSION: ${{ inputs.release_version || '' }}
        RELEASE_BUILD: ${{ inputs.release_build || false }}
      run: |
        set -euo pipefail
        chmod +x gradlew
        GRADLE_ARGUMENTS=()
        if [[ -n "$REQUESTED_RELEASE_VERSION" ]]; then
          GRADLE_ARGUMENTS+=("-PmphVersion=$REQUESTED_RELEASE_VERSION")
        elif [[ "$RELEASE_BUILD" == "true" ]]; then
          GRADLE_ARGUMENTS+=("-PreleaseBuild=true")
        fi
        ./gradlew "${GRADLE_ARGUMENTS[@]}" \
          clean koverXmlReport buildPlugin verifyPlugin sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization="$SONAR_ORGANIZATION" \
          -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=300 \
          --console=plain

    - name: Upload verified plugin
      uses: actions/upload-artifact@v7
      with:
        name: mph-intellij-plugin
        path: intellij-plugin/build/distributions/*.zip
        if-no-files-found: error

  branch-snapshot:
    name: Publish branch snapshot
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          github.ref_name != 'main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: branch-snapshot-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Download verified plugin
      uses: actions/download-artifact@v8
      with:
        name: mph-intellij-plugin
        path: snapshot-assets/plugin

    - name: Prepare branch snapshot
      id: snapshot
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        BRANCH_SLUG=$(printf '%s' "$BRANCH_NAME" |
          tr '[:upper:]' '[:lower:]' |
          sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
        [[ -n "$BRANCH_SLUG" ]] || { echo "::error::Invalid branch snapshot name."; exit 1; }

        mapfile -t PLUGIN_FILES < <(find snapshot-assets/plugin -type f -name '*.zip')
        if [[ ${#PLUGIN_FILES[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one IntelliJ plugin ZIP, found ${#PLUGIN_FILES[@]}."
          exit 1
        fi

        SNAPSHOT_TAG="snapshot-$BRANCH_SLUG"
        PLUGIN_ASSET="mph-intellij-plugin-$BRANCH_SLUG-SNAPSHOT.zip"
        cp "${PLUGIN_FILES[0]}" "snapshot-assets/$PLUGIN_ASSET"

        echo "tag=$SNAPSHOT_TAG" >> "$GITHUB_OUTPUT"
        echo "title=Snapshot: $BRANCH_NAME" >> "$GITHUB_OUTPUT"
        echo "plugin_asset=snapshot-assets/$PLUGIN_ASSET" >> "$GITHUB_OUTPUT"

    - name: Replace mutable branch snapshot
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SNAPSHOT_TAG: ${{ steps.snapshot.outputs.tag }}
        SNAPSHOT_TITLE: ${{ steps.snapshot.outputs.title }}
        PLUGIN_ASSET: ${{ steps.snapshot.outputs.plugin_asset }}
        BRANCH_NAME: ${{ github.ref_name }}
        VERIFIED_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1; then
          gh release delete "$SNAPSHOT_TAG" --cleanup-tag --yes
        elif gh api "repos/$GH_REPO/git/ref/tags/$SNAPSHOT_TAG" >/dev/null 2>&1; then
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$SNAPSHOT_TAG"
        fi
        gh release create "$SNAPSHOT_TAG" \
          "$PLUGIN_ASSET" \
          --target "$VERIFIED_SHA" \
          --title "$SNAPSHOT_TITLE" \
          --notes "Mutable plugin snapshot of branch '$BRANCH_NAME' at commit $VERIFIED_SHA. It passed the plugin tests, JetBrains compatibility verification, and SonarQube quality gate." \
          --prerelease \
          --latest=false
