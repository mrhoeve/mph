name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (leave empty to remove -SNAPSHOT from the develop version)
        required: false
        type: string
      next_development_version:
        description: Next version ending in -SNAPSHOT (leave empty to increment the final number)
        required: false
        type: string
      marketplace_mode:
        description: Bootstrap the first Marketplace release manually, or publish an existing plugin automatically
        required: true
        type: choice
        default: bootstrap
        options:
        - bootstrap
        - publish

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-develop:
    name: Validate develop branch
    runs-on: ubuntu-latest
    steps:
    - name: Require develop branch
      env:
        SELECTED_REF: ${{ github.ref }}
      run: |
        if [[ "$SELECTED_REF" != "refs/heads/develop" ]]; then
          echo "::error::Releases may only be started from the develop branch. Selected ref: $SELECTED_REF"
          exit 1
        fi

  build:
    name: Run release verification
    needs: validate-develop
    permissions:
      contents: write
    uses: ./.github/workflows/build-and-publish.yml
    with:
      release_version: ${{ inputs.release_version }}
      release_build: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sign:
    name: Sign verified plugin
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: |
          intellij-plugin/*.gradle.kts
          intellij-plugin/gradle.properties
          intellij-plugin/gradle/wrapper/gradle-wrapper.properties

    - name: Download verified plugin
      uses: actions/download-artifact@v8
      with:
        name: mph-intellij-plugin
        path: intellij-plugin/build/distributions

    - name: Verify signing configuration
      env:
        CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
        PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
        PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
      run: |
        [[ -n "$CERTIFICATE_CHAIN" ]] || { echo "::error::JETBRAINS_CERTIFICATE_CHAIN is not configured"; exit 1; }
        [[ -n "$PRIVATE_KEY" ]] || { echo "::error::JETBRAINS_PRIVATE_KEY is not configured"; exit 1; }
        [[ -n "$PRIVATE_KEY_PASSWORD" ]] || { echo "::error::JETBRAINS_PRIVATE_KEY_PASSWORD is not configured"; exit 1; }

    - name: Sign and verify plugin
      working-directory: intellij-plugin
      env:
        CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
        PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
        PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
      run: |
        set -euo pipefail
        chmod +x gradlew
        ./gradlew \
          -PmphVersion="$RELEASE_VERSION" \
          signPlugin verifyPluginSignature \
          -x buildPlugin \
          --console=plain

    - name: Prepare signed release artifact
      env:
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
      run: |
        set -euo pipefail
        mapfile -t SIGNED_FILES < <(find intellij-plugin/build/distributions -type f -name '*-signed.zip')
        if [[ ${#SIGNED_FILES[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one signed IntelliJ plugin ZIP, found ${#SIGNED_FILES[@]}."
          exit 1
        fi
        mkdir -p signed-assets
        cp "${SIGNED_FILES[0]}" "signed-assets/mph-intellij-plugin-$RELEASE_VERSION.zip"

    - name: Upload signed plugin
      uses: actions/upload-artifact@v7
      with:
        name: mph-intellij-plugin-signed
        path: signed-assets/mph-intellij-plugin-${{ needs.build.outputs.version }}.zip
        if-no-files-found: error
        retention-days: 7

  release:
    name: Publish release
    needs:
    - build
    - sign
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
    - name: Create release GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        permission-contents: write

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    - name: Download verified plugin
      uses: actions/download-artifact@v8
      with:
        name: mph-intellij-plugin-signed
        path: release-assets

    - name: Verify release artifact
      env:
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
      run: |
        test -f "release-assets/mph-intellij-plugin-$RELEASE_VERSION.zip" || {
          echo "::error::Verified IntelliJ plugin for version $RELEASE_VERSION is missing."
          exit 1
        }

    - name: Get GitHub App user ID
      id: app-user
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: echo "user-id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

    - name: Create and atomically publish release
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
        REQUESTED_NEXT_VERSION: ${{ inputs.next_development_version }}
        VERIFIED_DEVELOP_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        git fetch --force origin \
          +refs/heads/main:refs/remotes/origin/main \
          +refs/heads/develop:refs/remotes/origin/develop \
          --tags

        if [[ "$(git rev-parse origin/develop)" != "$VERIFIED_DEVELOP_SHA" ]]; then
          echo "::error::develop changed while release verification was running. Start a new release."
          exit 1
        fi
        if ! git merge-base --is-ancestor origin/main "$VERIFIED_DEVELOP_SHA"; then
          echo "::error::main is not an ancestor of develop. Synchronize the branches before releasing."
          exit 1
        fi
        if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
          echo "::error::Release version must contain dot-separated numeric components: $RELEASE_VERSION"
          exit 1
        fi

        TAG_NAME="v$RELEASE_VERSION"
        if git rev-parse --verify --quiet "refs/tags/$TAG_NAME" >/dev/null; then
          echo "::error::Tag $TAG_NAME already exists."
          exit 1
        fi

        if [[ -n "$REQUESTED_NEXT_VERSION" ]]; then
          NEXT_VERSION=$REQUESTED_NEXT_VERSION
        else
          IFS='.' read -ra VERSION_PARTS <<< "$RELEASE_VERSION"
          LAST_INDEX=$((${#VERSION_PARTS[@]} - 1))
          VERSION_PARTS[$LAST_INDEX]=$((${VERSION_PARTS[$LAST_INDEX]} + 1))
          NEXT_VERSION=$(IFS='.'; echo "${VERSION_PARTS[*]}")-SNAPSHOT
        fi
        if [[ ! "$NEXT_VERSION" =~ ^[0-9]+(\.[0-9]+)*-SNAPSHOT$ ]]; then
          echo "::error::Next development version is invalid: $NEXT_VERSION"
          exit 1
        fi

        git config user.name "$APP_SLUG[bot]"
        git config user.email "$APP_USER_ID+$APP_SLUG[bot]@users.noreply.github.com"
        git switch --detach "$VERIFIED_DEVELOP_SHA"

        CURRENT_VERSION=$(sed -n 's/^pluginVersion=//p' intellij-plugin/gradle.properties | tr -d '\r')
        if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
          echo "::error::develop must contain a -SNAPSHOT version: $CURRENT_VERSION"
          exit 1
        fi

        sed -i "s/^pluginVersion=.*/pluginVersion=$RELEASE_VERSION/" intellij-plugin/gradle.properties
        git add intellij-plugin/gradle.properties
        git commit -m "Release $RELEASE_VERSION"
        RELEASE_COMMIT=$(git rev-parse HEAD)
        git tag -a "$TAG_NAME" -m "Release $RELEASE_VERSION"

        sed -i "s/^pluginVersion=.*/pluginVersion=$NEXT_VERSION/" intellij-plugin/gradle.properties
        git add intellij-plugin/gradle.properties
        git commit -m "Prepare for next development iteration: $NEXT_VERSION"
        DEVELOPMENT_COMMIT=$(git rev-parse HEAD)

        git push --atomic origin \
          "$RELEASE_COMMIT:refs/heads/main" \
          "$DEVELOPMENT_COMMIT:refs/heads/develop" \
          "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ steps.app-token.outputs.token }}
        tag_name: v${{ needs.build.outputs.version }}
        name: Release v${{ needs.build.outputs.version }}
        body: "Manual IntelliJ plugin release of version ${{ needs.build.outputs.version }} from the verified develop branch."
        files: release-assets/mph-intellij-plugin-${{ needs.build.outputs.version }}.zip
        prerelease: false
        make_latest: "true"
        generate_release_notes: true

  marketplace:
    name: Publish to JetBrains Marketplace
    if: ${{ inputs.marketplace_mode == 'publish' }}
    needs:
    - build
    - release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
    - name: Download signed plugin
      uses: actions/download-artifact@v8
      with:
        name: mph-intellij-plugin-signed
        path: marketplace-assets

    - name: Verify Marketplace configuration
      env:
        PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      run: |
        [[ -n "$PUBLISH_TOKEN" ]] || { echo "::error::JETBRAINS_MARKETPLACE_TOKEN is not configured"; exit 1; }

    - name: Upload stable Marketplace update
      env:
        PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
      run: |
        set -euo pipefail
        PLUGIN_FILE="marketplace-assets/mph-intellij-plugin-$RELEASE_VERSION.zip"
        [[ -f "$PLUGIN_FILE" ]] || { echo "::error::Signed plugin artifact is missing."; exit 1; }
        curl \
          --fail-with-body \
          --silent \
          --show-error \
          --retry 3 \
          --header "Authorization: Bearer $PUBLISH_TOKEN" \
          --form "xmlId=nl.hicts.mph.plugin" \
          --form "file=@$PLUGIN_FILE" \
          https://plugins.jetbrains.com/api/updates/upload
